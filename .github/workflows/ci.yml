name: CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'main' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test:coverage

      - name: Install Playwright Browsers
        # Only happens if Build and Unit Tests pass
        run: npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
        env:
          CI: true

      # --- All Uploads at the End ---
      - name: Upload Test Results to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled() 
        uses: codecov/test-results-action@v1
        with:
          files: ./test-report.junit.xml
          use_oidc: true

      - name: Upload Coverage Report to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled() 
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7