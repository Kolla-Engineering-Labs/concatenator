name: CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'main' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so Codecov can find the base commit

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps

      - name: Build Project
        run: npm run build

      - name: Type Check (TypeScript)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Run Unit Tests with Coverage (Vitest)
        run: npm run test:coverage
        env:
          CONCATENATOR_API_TOKEN: ci-mock-token-998877

      - name: Archive coverage results
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: ./coverage/
          retention-days: 1

      # --- Visualize Coverage Directory ---
      - name: List coverage directory
        run: ls -R ./coverage

      # --- All Uploads at the End ---
      - name: Upload Test Results to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: ./coverage/test-report.junit.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload Coverage Report to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false
