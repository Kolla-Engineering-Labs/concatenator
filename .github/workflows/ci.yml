name: CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'main' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        include:
          - node-version: 24
            os: ubuntu-latest
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so Codecov can find the base commit

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Type Check (TypeScript)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Run Unit Tests (Vitest)
        run: npm run test:coverage
        continue-on-error: ${{ matrix.experimental == true }}

      - name: Archive coverage results
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: ./coverage/
          retention-days: 1

      - name: Update APT Repository
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in {1..5}; do
            sudo apt-get update && break || (echo "Retry $i..." && sleep 5)
          done

      - name: Install Playwright Browsers
        # Only happens if Build and Unit Tests pass
        run: npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
        env:
          CI: true

      # --- Visualize Coverage Directory ---
      - name: List coverage directory
        run: ls -R ./coverage

      # --- All Uploads at the End ---
      - name: Upload Test Results to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: ./coverage/test-report.junit.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload Coverage Report to Codecov
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7
