# SonarCloud Project Configuration
sonar.organization=kolla-engineering-labs
sonar.projectKey=Kolla-Engineering-Labs_concatenator
sonar.projectName=Concatenator

# Source Code & Test File Mapping
sonar.sources=src
sonar.tests=tests

# Architecture & Scope Boundaries
# Explicitly exclude tests, build artifacts, and coverage from source analysis
sonar.exclusions=tests/**,dist/**,coverage/**,workbench-ui/**,node_modules/**,scripts/**
sonar.test.inclusions=tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.test.exclusions=dist/**,coverage/**,node_modules/**

# Language and Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage Integration (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
